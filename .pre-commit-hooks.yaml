# init_your_proj 的 pre-commit 框架 hook 清单
# 用法见 README「用法二：pre-commit 框架」——在用户项目 .pre-commit-config.yaml 中
# 以远程仓库地址（repo: https://github.com/Fishskys/init_your_proj + rev: tag）引用，
# language: system 表示直接调用环境中已安装的 iyp（需 iyp 在 PATH 中）。
- id: iyp-check
  name: iyp check (sensitive info)
  description: 提交前敏感信息检查——只查暂存文件，命中 high/medium/low 阻断提交（零交互、零修改、输出脱敏）
  entry: iyp check --stage --strict
  language: system
  pass_filenames: false
  always_run: true
  stages: [pre-commit]
